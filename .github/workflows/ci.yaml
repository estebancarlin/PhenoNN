name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggers

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"

      - name: Install uv
        run: pip install uv

      - name: Create virtual environment and install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .[ci,dev]

      - name: Run pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          python -m tests.test_phenonn_installation
          python -m unittest tests.test_fcn
          python -m unittest tests.test_utils
          python -m unittest tests.test_logger
          python -m unittest tests.test_runner
          python -m unittest tests.test_diagnostics

      - name: Check package builds
        run: uv build
